name: False positive or unsafe recommendation
description: Report a finding that is incorrect, overstated, or unsafe to act on.
title: "[False positive]: "
labels:
  - false-positive
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, usernames, complete private paths, prompts, file contents, or a full application inventory. Replace `/Users/your-name` with `~` and keep only the path category needed to reproduce the rule.
  - type: input
    id: version
    attributes:
      label: Memento version
      placeholder: 0.7.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Finding area
      options:
        - Storage safe cleanup
        - Storage review clue
        - Background service
        - Application
        - Terminal diagnostic
        - Disk browser
    validations:
      required: true
  - type: input
    id: reason_codes
    attributes:
      label: Reason codes shown or exported
      description: Use stable reason codes only. Do not paste complete paths.
      placeholder: unmatched-local-identity, age-only-signal
  - type: textarea
    id: finding
    attributes:
      label: What Memento reported
      description: Include the confidence, risk, estimate quality, normalized path category, and proposed operation.
    validations:
      required: true
  - type: textarea
    id: reality
    attributes:
      label: Why the finding is incorrect or unsafe
      description: Explain the real owner or usage without sharing private file contents.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence and say whether an operation was executed.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, usernames, complete private paths, prompts, file contents, and unrelated application names.
          required: true
