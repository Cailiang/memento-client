name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./package-lock.json').version")" = "${package_version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi
      - run: npm test
      - run: npm run typecheck

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            os: macos-15-intel
            command: npm run dist:mac -- --x64
          - id: macos-arm64
            os: macos-15
            command: npm run dist:mac -- --arm64
          - id: windows-x64
            os: windows-2022
            command: npm run dist:win -- --x64
          - id: windows-arm64
            os: windows-11-arm
            command: npm run dist:win -- --arm64
          - id: linux-x64
            os: ubuntu-24.04
            command: npm run dist:linux -- --x64
          - id: linux-arm64
            os: ubuntu-24.04-arm
            command: npm run dist:linux -- --arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.id }}
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages and checksums
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "8"
          cd dist
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish bilingual GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Memento ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Memento ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
