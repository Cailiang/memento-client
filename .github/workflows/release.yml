name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./package-lock.json').version")" = "${package_version}"
          test -n "$(node -p "process.versions.sqlite || ''")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "v${package_version}" = "${GITHUB_REF_NAME}"
          fi
      - run: npm test
      - run: npm run typecheck

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-x64
            os: macos-15-intel
            command: npm run dist:mac -- --x64
          - id: macos-arm64
            os: macos-15
            command: npm run dist:mac -- --arm64
          - id: windows-x64
            os: windows-2022
            command: npm run dist:win -- --x64
          - id: windows-arm64
            os: windows-11-arm
            command: npm run dist:win -- --arm64
          - id: linux-x64
            os: ubuntu-24.04
            command: npm run dist:linux -- --x64
          - id: linux-arm64
            os: ubuntu-24.04-arm
            command: npm run dist:linux -- --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Import macOS signing certificate
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/memento-signing.p12"
          intermediate_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain_path="$RUNNER_TEMP/memento-signing.keychain-db"

          for required in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD; do
            test -n "${!required}"
          done
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$intermediate_path"
          test "$(shasum -a 256 "$intermediate_path" | awk '{print $1}')" = \
            "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$intermediate_path" -k "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "\"$APPLE_SIGNING_IDENTITY\""
      - name: Build signed and notarized ${{ matrix.id }}
        if: startsWith(matrix.id, 'macos-')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}
      - name: Build ${{ matrix.id }}
        if: ${{ !startsWith(matrix.id, 'macos-') }}
        run: ${{ matrix.command }}
      - name: Sign, notarize, and verify macOS DMG
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for required in APPLE_ID APPLE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID; do
            test -n "${!required}"
          done
          version="$(node -p "require('./package.json').version")"
          arch="${{ matrix.id == 'macos-arm64' && 'arm64' || 'x64' }}"
          dmg_path="release/Memento-${version}-${arch}.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          scripts/verify-mac-dmg.sh "$arch" "$dmg_path" developer-id
      - name: Remove temporary macOS signing keychain
        if: always() && startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/memento-signing.keychain-db"
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect packages and checksums
        shell: bash
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = "8"
          cd dist
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = "8"
      - name: Publish bilingual GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Memento ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Memento ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
