<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2ef" />
    <title>Memento</title>
    <style>
      html { --boot-bg: #f4f2ed; --boot-text: #28251f; --boot-muted: #8f877b; --boot-accent: #c34232; --boot-contrast: #fff; --boot-shadow: rgba(111, 47, 38, .13); }
      html[data-theme="graphite"] { --boot-bg: #101318; --boot-text: #edf0e6; --boot-muted: #7f877a; --boot-accent: #b7d12a; --boot-contrast: #171c12; --boot-shadow: rgba(3, 6, 10, .46); }
      html[data-theme="tiffany"] { --boot-bg: #e7f3f1; --boot-text: #163b3a; --boot-muted: #77908d; --boot-accent: #0a8f8a; --boot-contrast: #fff; --boot-shadow: rgba(10, 90, 86, .14); }
      html[data-theme="klein"] { --boot-bg: #eef1f8; --boot-text: #17213a; --boot-muted: #81899b; --boot-accent: #002fa7; --boot-contrast: #fff; --boot-shadow: rgba(0, 47, 167, .16); }
      html[data-theme="burgundy"] { --boot-bg: #f2e9ed; --boot-text: #3b2029; --boot-muted: #9a7e87; --boot-accent: #800020; --boot-contrast: #fff; --boot-shadow: rgba(128, 0, 32, .15); }
      html[data-theme="mars"] { --boot-bg: #e7efeb; --boot-text: #213a35; --boot-muted: #81938d; --boot-accent: #187d73; --boot-contrast: #fff; --boot-shadow: rgba(24, 125, 115, .14); }
      html[data-theme="prussian"] { --boot-bg: #071e2a; --boot-text: #edf4f3; --boot-muted: #748f93; --boot-accent: #f37021; --boot-contrast: #12232a; --boot-shadow: rgba(1, 12, 18, .48); }
      html[data-theme="midnight"] { --boot-bg: #171918; --boot-text: #eff1ed; --boot-muted: #858d87; --boot-accent: #0ababa; --boot-contrast: #10201f; --boot-shadow: rgba(5, 7, 6, .38); }
      html, body { width: 100%; height: 100%; margin: 0; background: var(--boot-bg); }
      body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
      .boot-screen { display: grid; width: 100%; height: 100%; place-items: center; color: var(--boot-text); background: var(--boot-bg); }
      .boot-lockup { display: grid; justify-items: center; }
      .boot-mark { position: relative; display: grid; width: 52px; height: 52px; place-items: center; border-radius: 11px; color: var(--boot-contrast); background: var(--boot-accent); box-shadow: 0 8px 20px var(--boot-shadow); animation: boot-breathe 1.35s ease-in-out infinite; }
      .boot-archive { position: relative; width: 24px; height: 19px; border: 3px solid currentColor; border-radius: 3px 3px 6px 6px; }
      .boot-archive::before { position: absolute; top: -8px; left: -4px; width: 26px; height: 7px; border: 3px solid currentColor; border-radius: 4px; content: ""; }
      .boot-archive::after { position: absolute; top: 5px; left: 7px; width: 6px; height: 3px; border-radius: 2px; background: currentColor; content: ""; }
      .boot-name { margin-top: 15px; font-size: 15px; font-weight: 720; }
      .boot-status { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: var(--boot-muted); font-size: 10px; }
      .boot-status i { width: 4px; height: 4px; border-radius: 50%; background: var(--boot-accent); animation: boot-dot 1.2s ease-in-out infinite; }
      .boot-status i:nth-child(2) { animation-delay: 160ms; }
      .boot-status i:nth-child(3) { animation-delay: 320ms; }
      @keyframes boot-breathe { 50% { transform: translateY(-2px); box-shadow: 0 12px 24px var(--boot-shadow); } }
      @keyframes boot-dot { 0%, 70%, 100% { opacity: .22; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-2px); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-status i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status" aria-label="Memento 正在启动"><div class="boot-lockup"><span class="boot-mark"><i class="boot-archive"></i></span><strong class="boot-name">Memento</strong><span class="boot-status"><i></i><i></i><i></i><span>正在准备本地工作区</span></span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
